<!DOCTYPE html><html class="dark h-full" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Instagram • Log in</title>
<!-- Tailwind CSS CDN with forms and container plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            igDarkBg: '#000000',
            igSurface: '#121212',
            igBorder: '#262626',
            igInput: '#121212',
            igInputBorder: '#363636',
            igBlue: '#0064e0',
            igBlueHover: '#1877f2',
            igSecondaryText: '#a8a8a8',
            igMutedText: '#737373',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom CSS Styles -->
<style data-purpose="gradient-styling">
    /* Gradient accent matching the 'close friends' highlight in reference */
    .close-friends-gradient {
      background: linear-gradient(90deg, #ff5364 0%, #e0329b 50%, #b429d2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .ig-icon-gradient {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%);
    }
  </style>
<style data-purpose="mobile-layout-tweaks">
    /* iOS specific safe area spacing & touch highlights */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
    }
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #ffffff;
      -webkit-box-shadow: 0 0 0px 1000px #121212 inset;
      transition: background-color 5000s ease-in-out 0s;
    }
  </style>
<!-- END: Custom CSS Styles -->
</head>
<body class="bg-igDarkBg text-white font-sans min-h-full flex flex-col justify-between items-center selection:bg-neutral-700 antialiased">
<!-- BEGIN: MainContentWrapper -->
<main class="w-full max-w-[390px] px-5 pt-8 pb-6 flex flex-col flex-1 items-center justify-between" data-purpose="mobile-container">
<!-- Upper Section: Branding & Form -->
<div class="w-full flex flex-col items-center">
<!-- BEGIN: BrandHeader -->
<section class="flex flex-col items-center text-center mt-2 mb-6" data-purpose="hero-branding">
<!-- Instagram Camera Logo Icon -->
<div class="mb-4 transition-transform active:scale-95 duration-150"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCaXKIU6lOmTkJV20TWWb1HgO3jRTVa7E-rv6RamlKL1ObFGtF7D3WxbgyrrgKPGT-sqypOUS4sEXVqQHFQulTya4AlfHPlmDE0mJJeEivNWqw-twW_Ochav00GW7Z3WNFeCTmohSVCp9M1Sh0WsYOU7gYzMkziyC5HP40m6b1qPQbbOB8zBmaQvSbdi5QKsXPS74uP4nxLngtpVYipM448PlAmSkQ0nGhSEhT3dpV3BVllGcPnBwxWDgcURCHqE1DmmYE" alt="Instagram" class="w-14 h-14 rounded-2xl object-contain shadow-lg shadow-pink-500/10"></div>
<!-- Headline adapted from reference image -->
<h1 class="text-xl font-bold tracking-tight text-white px-4 leading-snug">
          See everyday moments from your <span class="close-friends-gradient font-extrabold">close friends</span>.
        </h1>
</section>
<!-- END: BrandHeader -->
<!-- BEGIN: LoginFormSection -->
<section class="w-full bg-igSurface border border-igBorder/60 rounded-2xl p-5 shadow-2xl backdrop-blur-sm" data-purpose="login-form-card">
<h2 class="text-base font-semibold text-white mb-4 tracking-tight">
          Log into Instagram
        </h2>
<!-- Login Credentials Form -->
<form action="#" class="space-y-3" data-purpose="auth-form" method="POST" onsubmit="event.preventDefault();">
<!-- Username / Email Field -->
<div class="relative">
<input aria-label="Mobile number, username or email" class="w-full bg-black/40 border border-igInputBorder rounded-xl px-3.5 py-3 text-sm text-white placeholder-igSecondaryText focus:outline-none focus:border-neutral-400 focus:ring-1 focus:ring-neutral-400 transition-colors" id="username-input" name="username" placeholder="Mobile number, username or email" required="" type="text">
</div>
<!-- Password Field with Show/Hide Toggle -->
<div class="relative">
<input aria-label="Password" class="w-full bg-black/40 border border-igInputBorder rounded-xl px-3.5 py-3 pr-16 text-sm text-white placeholder-igSecondaryText focus:outline-none focus:border-neutral-400 focus:ring-1 focus:ring-neutral-400 transition-colors" id="password-input" name="password" placeholder="Password" required="" type="password">
<button class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs font-semibold text-igSecondaryText hover:text-white transition-colors select-none py-1 px-1" data-purpose="password-visibility-toggle" id="toggle-password-btn" type="button">
              Show
            </button>
</div>
<!-- Primary Submit Button -->
<div class="pt-1.5">
<button class="w-full bg-igBlue hover:bg-igBlueHover active:opacity-90 text-white text-sm font-semibold rounded-xl py-2.5 px-4 text-center transition-all duration-150 shadow-sm shadow-blue-500/20" type="submit">
              Log in
            </button>
</div>
</form>
<!-- Forgot Password Link -->
<div class="text-center mt-3.5">
<a class="text-xs font-medium text-igSecondaryText hover:text-white transition-colors" href="#">
            Forgot password?
          </a>
</div>
<!-- Divider with Text -->
<div class="relative my-4 flex items-center justify-center">
<div class="w-full border-t border-igBorder"></div>
<span class="absolute bg-igSurface px-3 text-[11px] uppercase tracking-wider text-igMutedText font-semibold">
            or
          </span>
</div>
<!-- Social Action: Log in with Facebook -->
<button class="w-full bg-neutral-900 hover:bg-neutral-800 border border-igBorder text-white text-sm font-semibold rounded-xl py-2.5 px-4 flex items-center justify-center gap-2 transition-colors active:scale-[0.99]" data-purpose="facebook-login-action" type="button">
<!-- Official Facebook Blue Icon -->
<svg class="w-4 h-4 text-[#1877f2] fill-current" viewBox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
<span class="">Log in with Facebook</span>
</button>
<!-- Secondary Action: Create Account Outline Button -->
<div class="mt-2.5">
<button class="w-full border border-igBlue text-igBlue hover:bg-igBlue/10 text-sm font-semibold rounded-xl py-2.5 px-4 text-center transition-colors" data-purpose="create-account-button" type="button">
            Create new account
          </button>
</div>
<!-- Meta Brand Badge -->
<div class="mt-5 pt-3 flex items-center justify-center gap-1.5 text-igSecondaryText border-t border-igBorder/40" data-purpose="meta-branding-badge">
<!-- Meta Infinity Emblem -->
<svg class="w-4 h-4 fill-current text-white/70" viewBox="0 0 24 24">
<path d="M12.001 8.163c-1.84 0-3.415 1.134-4.526 2.723-1.076-1.536-2.614-2.652-4.408-2.652C1.371 8.234 0 9.778 0 12.029c0 2.502 1.644 4.516 3.655 4.516 1.795 0 3.33-1.116 4.408-2.652 1.111 1.589 2.686 2.723 4.526 2.723 1.84 0 3.415-1.134 4.526-2.723 1.076 1.536 2.614 2.652 4.408 2.652 2.011 0 3.655-2.014 3.655-4.516 0-2.251-1.371-3.795-3.067-3.795-1.794 0-3.332 1.116-4.408 2.652-1.111-1.589-2.686-2.723-4.526-2.723zm-7.65 6.438c-1.075 0-1.874-1.066-1.874-2.572s.799-2.572 1.874-2.572c1.075 0 1.875 1.066 1.875 2.572s-.8 2.572-1.875 2.572zm15.3 0c-1.075 0-1.875-1.066-1.875-2.572s.8-2.572 1.875-2.572 1.874 1.066 1.874 2.572-.799 2.572-1.874 2.572z"></path>
</svg>
<span class="text-xs font-medium tracking-wide text-white/70">Meta</span>
</div>
</section>
<!-- END: LoginFormSection -->
</div>
<!-- BEGIN: FooterSection -->
<footer class="w-full mt-8 flex flex-col items-center text-center space-y-3" data-purpose="mobile-footer">
<!-- Condensed Meta links -->
<nav class="flex flex-wrap justify-center gap-x-3 gap-y-1.5 text-[11px] text-igMutedText">
<a class="hover:underline" href="#">About</a>
<a class="hover:underline" href="#">Help</a>
<a class="hover:underline" href="#">Privacy</a>
<a class="hover:underline" href="#">Terms</a>
<a class="hover:underline" href="#">Meta Verified</a>
</nav>
<!-- Language Switcher & Copyright -->
<div class="flex items-center justify-center gap-2 text-xs text-igMutedText">
<!-- Language Selector dropdown mockup -->
<button class="flex items-center gap-1 hover:text-igSecondaryText transition-colors focus:outline-none" type="button">
<span class="">English</span>
<svg class="w-3 h-3 stroke-current fill-none stroke-2" viewBox="0 0 24 24">
<polyline points="6 9 12 15 18 9"></polyline>
</svg>
</button>
<span class="text-neutral-600">•</span>
<span class="">© 2026 Instagram from Meta</span>
</div>
</footer>
<!-- END: FooterSection -->
</main>
<!-- END: MainContentWrapper -->
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="password-visibility-handler">
    // Logic for toggling visibility of the password field
    const passwordInput = document.getElementById('password-input');
    const togglePasswordBtn = document.getElementById('toggle-password-btn');

    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        togglePasswordBtn.textContent = isPassword ? 'Hide' : 'Show';
      });
    }
  </script>
<!-- END: InteractiveScripts -->
</body></html>
