<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Instagram • We'll be back soon</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          igBlue: '#0064e0',
          igBlueHover: '#1877f2',
        },
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
        }
      }
    }
  };
</script>
<style>
  .ig-gradient {
    background: linear-gradient(90deg, #fd5949 0%, #d6249f 60%, #285AEB 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .spin-slow {
    animation: spin 1.4s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center font-sans antialiased px-6 selection:bg-neutral-800">

<main class="flex flex-col items-center text-center max-w-md mx-auto w-full">
  <!-- Instagram camera logo -->
  <div class="mb-8">
    <svg class="w-16 h-16 mx-auto" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <lineargradient id="ig-camera-gradient-maintenance" x1="10%" x2="90%" y1="100%" y2="0%">
          <stop offset="0%" stop-color="#ffd521"></stop>
          <stop offset="25%" stop-color="#f50000"></stop>
          <stop offset="65%" stop-color="#c13584"></stop>
          <stop offset="100%" stop-color="#833ab4"></stop>
        </lineargradient>
      </defs>
      <rect height="19" rx="5.5" stroke="url(#ig-camera-gradient-maintenance)" stroke-width="2.1" width="19" x="2.5" y="2.5"></rect>
      <circle cx="12" cy="12" r="4.2" stroke="url(#ig-camera-gradient-maintenance)" stroke-width="2.1"></circle>
      <circle cx="17.6" cy="6.4" fill="url(#ig-camera-gradient-maintenance)" r="1.2"></circle>
    </svg>
  </div>

  <div class="w-8 h-8 rounded-full border-[3px] border-neutral-800 border-t-neutral-500 spin-slow mb-8" aria-hidden="true"></div>

  <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight mb-3">
    Server down
  </h1>
  <p class="text-neutral-300 text-[15px] mb-1">
    Please try again later.
  </p>
  <p class="text-neutral-500 text-sm mb-10">
    Instagram is currently under maintenance.
  </p>

  <div class="flex flex-col sm:flex-row items-center gap-3 w-full">
    <a href="/"
       class="w-full sm:w-auto flex items-center justify-center gap-2 bg-igBlue hover:bg-igBlueHover text-white font-medium text-sm py-2.5 px-6 rounded-full transition-colors">
      Try again
    </a>
    <span class="text-xs text-neutral-600">We'll be back soon.</span>
  </div>
</main>

<footer class="absolute bottom-6 w-full text-center text-xs text-neutral-600">
  <span>© 2026 Instagram from Meta</span>
</footer>

</body>
</html>
